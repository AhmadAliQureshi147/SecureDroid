title: World-accessible file mode
id: 6f1e0a2b-7c3d-4e5f-9a1b-2c3d4e5f6a01
status: stable
description: A file is opened with a world-accessible mode.
logsource:
  product: android
  category: source
detection:
  selection:
    line|re:
      - 'MODE_WORLD_(?:READABLE|WRITEABLE)'
      - 'openFileOutput\s*\([^,\n]*,\s*[12]\s*\)'
      - 'getSharedPreferences\s*\([^,\n]*,\s*[12]\s*\)'
  condition: selection
level: high
tags:
  - securedroid.STORAGE-WORLD-ACCESSIBLE
